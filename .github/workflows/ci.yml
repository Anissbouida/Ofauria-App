name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build shared package
        run: npm run build:shared

      - name: Typecheck server
        run: npm run build --workspace=server

      - name: Setup integration test database
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          server/scripts/test-db-setup.sh
        env:
          PGUSER: postgres
          TEST_PG_HOST: localhost
          TEST_PG_PORT: '5432'
          JWT_SECRET: ci-only-test-secret-not-used-in-production-0123456789

      - name: Run server tests
        run: npm run test --workspace=server -- --run
        # Tests unitaires (base simulée) + tests d'intégration contre le service Postgres
        # ci-dessus (base kalum_test montée par test-db-setup.sh, TEST_DATABASE_URL défini).
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-test-secret-not-used-in-production-0123456789
          DATABASE_URL: postgres://postgres@localhost:5432/kalum_test
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/kalum_test

      - name: Build client
        run: npm run build --workspace=client

  docker-build:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
